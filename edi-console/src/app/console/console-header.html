<header class="sr-nav">
  <div class="sr-nav__inner">
    <span class="sr-brand">
      <svg class="sr-brand__mark" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <ellipse cx="17" cy="17" rx="15" ry="6.5" transform="rotate(-24 17 17)" opacity="0.55" />
        <path d="M17 6.5 23.5 24 17 20.2 10.5 24Z" fill="currentColor" fill-opacity="0.16" />
        <circle cx="29.2" cy="11.6" r="1.4" fill="currentColor" stroke="none" />
      </svg>
      <span class="sr-brand__wm">EDI</span>
      <h1 class="sr-brand__sub">Sitrep</h1>
    </span>
    @if (mode(); as mode) {
      <span class="sr-presence">
        <span class="sr-presence__mode sr-presence__mode--{{ mode }}" [attr.title]="presence()?.words">{{ mode }}</span>
        @if (mode !== 'present' && mode !== 'demo') {
          <button type="button" class="sr-presence__button" (click)="presenceChosen.emit('present')">Present</button>
        }
        @if (mode === 'demo') {
          <button type="button" class="sr-presence__button" (click)="presenceChosen.emit('demo-off')">End demo</button>
        } @else {
          <button type="button" class="sr-presence__button" (click)="presenceChosen.emit('demo')">Demo</button>
        }
        <button type="button" class="sr-latch" [attr.aria-expanded]="personalityOpen()" (click)="personalityToggled.emit()">Personality</button>
      </span>
    }
    <span class="sr-clock">
      <span class="sr-clock__sd">@if (day(); as day) {<span class="sr-clock__day">{{ day }} · </span>}{{ time() }}</span>
      <span class="sr-clock__home">{{ machine() ?? '-' }}</span>
    </span>
  </div>
</header>
