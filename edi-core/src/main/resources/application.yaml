edi:
  home: ${EDI_HOME:${user.home}/.edi}
  checkout: ${EDI_CHECKOUT:${user.home}/EDI}
  machine:
    boot-id: /proc/sys/kernel/random/boot_id
  workers:
    socket: edi
    claude-config: ${CLAUDE_CONFIG_DIR:${user.home}}

server:
  address: 127.0.0.1
  port: 47318

spring:
  application:
    name: edi-core
  main:
    banner-mode: off

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
