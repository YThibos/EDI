edi:
  home: ${EDI_HOME:${user.home}/.edi}
  checkout: ${EDI_CHECKOUT:${user.home}/EDI}
  machine:
    boot-id: /proc/sys/kernel/random/boot_id
  workers:
    socket: edi
    claude-home: ${user.home}

server:
  address: 127.0.0.1
  port: 5490

spring:
  application:
    name: edi-core
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  web:
    resources:
      cache:
        use-last-modified: false
        cachecontrol:
          no-cache: true
  lifecycle:
    timeout-per-shutdown-phase: PT30S

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health,metrics
  metrics:
    distribution:
      expiry:
        all: ${edi.health.sample-every:PT10M}
      buffer-length:
        all: 1
