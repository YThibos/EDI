commands:
  test: "./mvnw -B -ntp test -Pfast"

commit:
  branch_pattern: '([A-Z][A-Z0-9]*-[0-9]+)'
  fix_message: "{{.Branch}} {{.Summary}}"
  trailers: []

pr:
  title_format: "{{.Branch}} {{.Title}}"

providers:
  github:
    draft_pull_requests: true

ignore_patterns:
  - "mvnw"
  - "mvnw.cmd"
  - ".mvn/wrapper/**"
  - "edi-console/package-lock.json"

document:
  instructions: |
    docs/decisions/ owns the why of every architecture and design decision, one current record per decision in a file named by its topic: a changed decision rewrites its record and adds a dated line to its How we got here, and the captain's answers, preferences and operating rules are never records.
    docs/verification/ owns live evidence about the external tools EDI drives, each file stating the tool version it was verified on.
    README.md owns what EDI is and how to build it.
    Code carries no explanatory comments; a decision record names the classes it governs instead.
    Tracked files never hold anything about a particular person, employer or machine.

review:
  path_instructions:
    - path: "docs/decisions/**"
      instructions: |
        A record holds one architecture or design decision as it stands now, in a file named by its topic slug, with no number and no hand-maintained index.
        Flag a record that holds a preference, an answer or an operating rule rather than a decision, a changed decision without a dated How we got here line, or a new record for a decision an existing record already covers.
    - path: "*.java"
      instructions: |
        Code carries no explanatory comments; only licence headers, suppression justifications and TODO or FIXME lines that carry an EDI key are allowed.
