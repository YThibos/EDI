[tools]
node = "26.13.1"
"aqua:gitleaks/gitleaks" = "8.30.1"

[tools."github:graalvm/graalvm-ce-builds"]
version = "25.6.5.1"
version_prefix = "graal-"

[tools."github:graalvm/graalvm-ce-builds".platforms]
linux-x64 = { asset_pattern = "graalvm-community-jdk-*_linux-x64_bin.tar.gz" }
linux-arm64 = { asset_pattern = "graalvm-community-jdk-*_linux-aarch64_bin.tar.gz" }

[env]
JAVA_HOME = { value = "{{ tools['github:graalvm/graalvm-ce-builds'].path }}", tools = true }
