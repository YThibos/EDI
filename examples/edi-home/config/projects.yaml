projects:
  - name: example-service
    clone: ~/.edi/projects/example-service
    captainCheckout: /path/to/checkouts/example-service
    forge: { kind: gitlab, host: gitlab.example.org, path: team/example-service, account: example-user }
    base: main
    delivery: draft-review
    tracker: { kind: jira, projectKey: EXAMPLE }
    branchKinds: [feature, chore, research]
    craftRules: true
    aiScaffolding: committed
    capacity: 2
    largeBuilds: true
    verify: ./mvnw -B verify
    shipBriefRules: [decision-log-adr, no-explanatory-comments]
  - name: EDI
    forge: { kind: github, path: example-owner/EDI, account: example-owner }
    base: main
    delivery: draft-review
    tracker: { kind: edi, projectKey: EDI }
    craftRules: true
    aiScaffolding: committed
    verify: ./mvnw -B verify
    nativeBuild: ./mvnw -B -Pnative,quick-build verify
    ciRuns: false
  - name: hobby-tool
    clone: ~/.edi/projects/hobby-tool
    captainCheckout: /path/to/checkouts/hobby-tool
    base: main
    delivery: local-branch
    tracker: { kind: edi, projectKey: HOBBY }
    login: hobby
